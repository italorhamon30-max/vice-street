name: Build Vice Street APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and sync Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Sign APK with apksigner
        run: |
          KEYSTORE=/tmp/vice-debug.keystore
          keytool -genkeypair -v -keystore "$KEYSTORE" -alias vicekey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=ViceStreet, OU=Dev, O=Game, L=City, S=State, C=BR"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android --out android/app/build/outputs/apk/debug/vice-street-signed.apk android/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/debug/vice-street-signed.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vice-street-signed-apk
          path: android/app/build/outputs/apk/debug/vice-street-signed.apk
          if-no-files-found: error
